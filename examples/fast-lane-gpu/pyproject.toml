[project]
name = "labflux-fast-lane-gpu-example"
version = "0.1.0"
description = "Fast lane on a GPU: pytest and a smoke training run in a LabFlux session"
requires-python = ">=3.12"
dependencies = ["torch==2.6.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Same torch and index as examples/uv-gpu and examples/mnist, so the Worker's uv cache is reused.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
