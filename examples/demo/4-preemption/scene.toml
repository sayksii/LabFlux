# Slide 9: an older job that saved recently loses less work than the later job.
title = "搶占：優先保留較多未存進度（GPU）"
run_order = 3
axis = "GPU 卡（看 kindred 的兩張 A40）"

[requires]
model = ["stopped"]
no_jobs = true

[[steps]]
user = "alice"
submit = "low.json"
label = "job1"
say = "Job1 先進入，上方 A40；優先權 2，每 2 秒儲存真正的 checkpoint。"

[[steps]]
wait_running = ["job1"]

[[steps]]
wait = 5
say = "Job1 開始執行後等 5 秒，再送入 Job2。"

[[steps]]
user = "alice"
submit = "later.json"
label = "job2"
say = "Job2 後進入，下方 A40；同樣優先權 2，沒有 checkpoint，停止會失去從開始到現在的進度。"

[[steps]]
wait_running = ["job2"]

[[steps]]
wait_checkpoint = ["job1", "job2"]
say = "等 Worker 回報 Job1 較新的 checkpoint，再展示兩個工作的未存進度。"

[[steps]]
pause = "第一幕：兩張 A40 都在使用中。比較 checkpoint 時間，講完按 Enter，送入高優先權 Job。"
ready = ["job1", "job2"]

[[steps]]
wait_checkpoint = ["job1", "job2"]

[[steps]]
user = "bob"
submit = "urgent.json"
label = "urgent"
say = "第二幕：高優先權 Job 要一張 A40。Job1 剛存過 checkpoint，停止損失較小，因此先停止 Job1。"

[[steps]]
wait_running = ["urgent", "job2"]
say = "等 Job1 容器確認停止，高優先權 Job 才取得它的 A40；Job2 繼續執行。"

[[steps]]
wait_preempted = "job1"
say = "Job1 的這次執行標記 PREEMPTED，工作回到 queue，等待資源重新執行。"

[[steps]]
pause = "Job1 已回到 queue；上方是高優先權 Job，下方 Job2 繼續跑。講完按 Enter 清場。"
ready = ["urgent", "job2"]
