# GPU scene 3: occupy both A40s, queue a two-card head and a one-card small job, then let
# the original short job finish naturally. Enter submits the queued pair and starts the
# 10-second countdown via the Scheduler API. A second Enter cleans up at the end.
title = "EASY backfill（GPU）"
run_order = 2
axis = "GPU 卡（看 kindred 的兩張 A40）"

[requires]
model = ["stopped"]
no_jobs = true

[[steps]]
user = "alice"
submit = "held-long.json"
label = "original-long"

[[steps]]
wait_running = ["original-long"]
say = "先啟動原始長工作，在 kindred 占住上方第一張 A40（時限 10 分鐘）。"

[[steps]]
user = "alice"
submit = "held-short.json"
label = "original-short"
gate = true

[[steps]]
wait_running = ["original-short"]
say = """
場景 1：kindred 兩張 A40 各有一個不同的原始工作執行中。
上方原始長工作時限 10 分鐘，下方原始短工作時限 3 分鐘，Dashboard 的「時限到」會顯示一晚一早。
兩個工作持續占住 A40，等待講者按 Enter 送出大 Job 與小 Job。"""

[[steps]]
pause = "場景 1：兩張 A40 都在使用中。講完按 Enter，送出需要兩張 A40 的大 Job 與需要一張 A40 的小 Job。"
ready = ["original-long", "original-short"]

[[steps]]
user = "bob"
submit = "head.json"
label = "head"
say = """
場景 2：bob 的大 Job 指定兩張 A40，排在隊首（head_reserved）。
兩張 A40 都在使用中，隊首等待並取得保留時段（看 kindred 欄頭）。"""

[[steps]]
user = "alice"
submit = "short.json"
label = "short"
signal = "original-short"
say = """
alice 的小 Job 指定一張 A40，時限 2 分鐘，排在大 Job 後面。
此時兩個新工作都在排隊；看排隊順序中的大 Job、小 Job。"""

[[steps]]
wait_running = ["short"]
say = """
已送出大、小 Job，原始短工作偵測到本輪小 Job 後，開始 10 秒完成倒數。
場景 3 自動推進：倒數啟動約 10 秒後，原始短工作自然完成，釋放一張 A40。
小 Job 自動利用空出的卡先跑，區塊顯示 backfill；大 Job 繼續保有雙卡的保留時段。"""

[[steps]]
pause = "小 Job 已自動 backfill 到空出的 A40。指著 backfill 標記與大 Job 的保留時段解說，講完按 Enter 清場。"
ready = ["original-long", "short"]
