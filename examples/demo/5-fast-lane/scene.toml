# Scene 5: a fast-lane session goes first and preempts a small preemptible batch job, while
# gemma4-31b holds kindred's 8 CPU. Verified in tests/test_storyboard.py and replayed from this
# file by tests/test_demo_scenes.py.
title = "fast lane：session 優先，搶占小的批次工作"
run_order = 5
axis = "CPU 核心"

[requires]
model = ["starting", "serving"]
no_jobs = true

[[steps]]
user = "bob"
submit = "train24.json"
label = "train24"

[[steps]]
user = "bob"
submit = "train16.json"
label = "train16"

[[steps]]
user = "bob"
submit = "train12.json"
label = "train12"

[[steps]]
user = "alice"
submit = "sweep.json"
label = "sweep"

[[steps]]
user = "alice"
submit = "waiting.json"
label = "waiting"
say = """
CPU 軸：kindred（24 核）、karma（16 核）、kayle（12 核 + alice 的 4 核可搶占小工作）全滿。
alice 的 8 核工作在排隊。"""

[[steps]]
pause = "在 bob 的終端機（/tmp/lf-demo，見 docs/demo.md）執行 `labflux shell`，再執行 `python hello.py`；看到輸出後回來按 Enter。"

[[steps]]
say = """
排隊表：session 排第 1（「互動工作優先」），等 alice 的 4 核工作停止；alice 的 8 核工作 no_capacity。
SESSION 區塊出現在 kayle（擁有者、閒置到期倒數，每個指令後重新起算）。
bob 不可搶占的工作照常執行；alice 的 4 核工作「被搶占 1 / 3 次」重新排隊。第二個指令沿用同一個容器。"""
