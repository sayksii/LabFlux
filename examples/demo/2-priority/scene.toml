# GPU scene 2 in stages the presenter starts with Enter: where a job runs, then who goes first
# (priority and fair share), then who gets the next free card. Verified in
# tests/test_storyboard_gpu.py and replayed from this file by tests/test_demo_scenes.py. Every card
# starts free and nobody asks for gemma.
#
# bob's P5 ranks ahead of alice's earlier P5 by about the minutes between her five jobs starting
# and her P5 going in (her usage grows 1 per minute while all five cards are hers), so talk about
# placement for at least a minute before the first Enter.
title = "配置、優先權與公平性（GPU）"
run_order = 1
axis = "GPU 卡"

[requires]
model = ["stopped"]
no_jobs = true
# bob's priority 5 job ranks ahead of alice's earlier one only while bob has used (almost)
# nothing in the last 60 minutes.
max_usage_min = { bob = 1.0 }

# Stage 1, "Where a Job Runs": the system picks the machine.
[[steps]]
user = "alice"
submit = "sweep.json"
count = 5
label = "sweep"
say = """
alice 送出 5 個工作，每個只說要 1 張 GPU，沒有指定機器。
GPU 卡軸：五張卡各一個 alice 區塊（karma 4090；kayle A5000、3090；kindred 兩張 A40）。
決策欄：「放得下 kayle、kindred；選 kayle：剩餘的合適 GPU 最少」：系統挑最合適的那台，大卡留給大工作。"""

[[steps]]
pause = "講完配置（至少 1 分鐘）、換到 Who Goes First 時按 Enter：alice 送 P5，5 秒後 bob 送 P9，再 5 秒 bob 送 P5。"

# Stage 2, "Who Goes First": priority, then fair share.
[[steps]]
user = "alice"
submit = "p5.json"
label = "alice-p5"
say = "alice 先送優先權 5 的工作：五張卡都滿了，排隊（no_capacity）。"

[[steps]]
wait = 5

[[steps]]
user = "bob"
submit = "urgent.json"
label = "urgent"
say = """
bob 送優先權 9 的工作：比 alice 晚送，卻排到第 1（head_reserved，分數 900 起）。
保留時段在 karma：最早有卡空出來的地方（看欄頭）。"""

[[steps]]
wait = 5

[[steps]]
user = "bob"
submit = "p5.json"
label = "bob-p5"
say = """
bob 再送一個優先權 5 的：一樣比 alice 晚，也排在 alice 前面。
  1 bob P9    900 + 等待 − 0
  2 bob P5    500 + 等待 − 0
  3 alice P5  500 + 等待 − 用量（五張卡都是她的，剛用了幾分鐘，被扣分：fair share）
誰在用表：alice 有用量，bob 0。"""

[[steps]]
pause = "按 Enter：alice 取消一個工作（kayle 的 A5000），看空出來的卡給誰。不做就按 Ctrl-C 結束本幕。"

# The next free card goes to the head of the queue.
[[steps]]
cancel = "sweep"
index = 2
say = """
空出來的卡給了 bob 的 P9：先顯示「等 kayle 上的工作停止」，接著落在 kayle 的 A5000。不是比較早送的 alice。
排隊表變成：1 bob P5 head_reserved，2 alice P5。"""

[[steps]]
pause = "講完按 Enter 結束本幕。"
