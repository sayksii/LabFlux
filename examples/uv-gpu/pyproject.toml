[project]
name = "labflux-uv-gpu-example"
version = "0.1.0"
description = "Smallest LabFlux GPU job: uv installs PyTorch from the lockfile inside the default image"
requires-python = ">=3.12"
dependencies = ["torch==2.6.0"]

[tool.uv]
# The cu124 wheels exist for Linux only; resolve for the Workers' platform.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

# 2.6.0 is the newest torch on the cu124 index. CUDA 12.4 wheels also run on CUDA 12.2
# drivers (kayle, driver 535) through CUDA minor-version compatibility.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
