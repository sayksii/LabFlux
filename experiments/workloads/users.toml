name = "users"
description = """User contention with equal demand (lab case). alice, bob and carol each submit ten identical
8-core jobs, 10 s apart; seven fit at a time (kayle 2, karma 2, kindred 3). FCFS serves whoever
arrived first; the fairness score (recent usage) lets the later users in sooner. Jobs sleep."""

[defaults]
cpu = 8
memory_mib = 4096
run_s = 45
time_limit_s = 90
priority = 5
load = "sleep"

[[jobs]]
id = "u01"
at = 0.0
user = "alice"

