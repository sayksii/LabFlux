name = "gpu"
description = """GPU contention (lab case). Three experiment cards: kayle RTX 3090 + RTX A5000, karma RTX 4090.
A two-card job (only kayle has two) becomes the blocked head while kayle has one card busy; one-card
jobs, one of them requiring the 4090, keep arriving. Every job runs a matmul loop for its run time."""

[defaults]
cpu = 4
memory_mib = 8192
priority = 5
load = "gpu"

[[jobs]]
id = "g01"
at = 0
user = "alice"
gpu = 1
run_s = 90
time_limit_s = 150

