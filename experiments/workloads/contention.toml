name = "contention"
description = """CPU, RAM and GPU contention with big and small jobs (lab case). A 16-core job fills kayle,
so a 2-GPU job (only kayle has two cards) blocks the head of the queue; a 40 GiB job (only kayle
fits it) and a 24-core job (only kindred fits it) follow. Small jobs could run on karma and
kindred meanwhile. CPU jobs burn their quota, GPU jobs run a matmul loop, RAM jobs sleep."""

[defaults]
priority = 5
memory_mib = 2048

[[jobs]]
id = "k01"
at = 0
user = "alice"
cpu = 4
memory_mib = 8192
gpu = 1
load = "gpu"
run_s = 90
time_limit_s = 150

