name = "urgent"
description = """High-priority insertion (lab case). alice fills the seven 8-core slots with priority-2 jobs that
are safe to rerun and preemptible, ending one by one; bob queues four priority-5 jobs; carol and
dave then submit priority-9 jobs. FCFS keeps them behind bob; priority lets them jump the queue;
with preemption they stop alice's most recent job instead of waiting. Jobs sleep."""

[defaults]
cpu = 8
memory_mib = 4096
load = "sleep"

[[jobs]]
id = "p01"
at = 0.0
user = "alice"
priority = 2
preemptible = true
run_s = 60
time_limit_s = 120

